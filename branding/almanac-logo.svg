<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34240e"/><stop offset="1" stop-color="#0c0804"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0a8"/><stop offset="0.45" stop-color="#ffd100"/><stop offset="1" stop-color="#a87a0a"/>
    </linearGradient>
    <linearGradient id="letter" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#fff3b0"/><stop offset="0.4" stop-color="#ffd100"/><stop offset="1" stop-color="#9a6d06"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#000" flood-opacity="0.6"/></filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect x="14" y="14" width="484" height="484" rx="34" fill="none" stroke="url(#gold)" stroke-width="7"/>
  <rect x="30" y="30" width="452" height="452" rx="22" fill="none" stroke="#ffd100" stroke-width="1.8" opacity="0.4"/>
  <!-- faint price grid -->
  <g stroke="#ffd100" stroke-width="1.5" opacity="0.12">
    <path d="M60 150 H452"/><path d="M60 230 H452"/><path d="M60 310 H452"/><path d="M60 390 H452"/>
  </g>
  <g filter="url(#shadow)">
    <!-- the A: two strong legs; the crossbar is a rising price line -->
    <path d="M226 78 L286 78 L428 424 L362 424 L256 164 L150 424 L84 424 Z" fill="url(#letter)" stroke="#7a5408" stroke-width="4" stroke-linejoin="round"/>
  </g>
  <path d="M132 372 L196 322 L226 342 L282 270 L318 292 L378 214" fill="none" stroke="#2a1a05" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <path d="M132 372 L196 322 L226 342 L282 270 L318 292 L378 214" fill="none" stroke="#fff8e0" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M132 372 L196 322 L226 342 L282 270 L318 292 L378 214" fill="none" stroke="#2f7d32" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="378" cy="214" r="17" fill="#2f7d32" stroke="#fff8e0" stroke-width="6"/>
  <!-- sparkles -->
  <g fill="#fff8d0">
    <path d="M410 100 l5 16 16 5 -16 5 -5 16 -5 -16 -16 -5 16 -5 z"/>
    <path d="M98 110 l3.5 11 11 3.5 -11 3.5 -3.5 11 -3.5 -11 -11 -3.5 11 -3.5 z" opacity="0.8"/>
  </g>
</svg>
